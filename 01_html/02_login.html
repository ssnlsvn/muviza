<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Lumis</title>
    <!-- Rutas de estilos -->
    <link rel="stylesheet" href="../02_css/01_estilos_generales.css">
    <link rel="stylesheet" href="../02_css/02_autenticacion.css">
</head>
<body>

    <div class="ventana-retro">
        <!-- Barra superior estilo app retro -->
        <div class="barra-titulo">
            <div class="puntos-ventana">
                <span class="punto punto-rojo"></span>
                <span class="punto punto-amarillo"></span>
                <span class="punto punto-verde"></span>
            </div>
            <span class="titulo-exe">=^.^=.exe</span>
            <div></div>
        </div>

        <div class="contenido-formulario">
            
            <!-- Panel superior: Temas y Modo Oscuro -->
            <div class="panel-superior">
                <div class="selector-temas-container">
                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--color-titulo);">Tema:</span>
                    <div class="circulo-tema activo" data-tema="mint" title="Mint Choco" style="background-color: #8ab6b1;"></div>
                    <div class="circulo-tema" data-tema="waterfall" title="Waterfall" style="background-color: #81a1c1;"></div>
                    <div class="circulo-tema" data-tema="prim" title="Prim" style="background-color: #f3c2d3;"></div>
                </div>
                
                <button type="button" id="btnModoOscuro" class="switch-modo-oscuro">
                    <span id="iconoModo">🌙</span> <span id="textoModo">Modo Oscuro: OFF</span>
                </button>
            </div>

            <h2 class="titulo-principal">Iniciar Sesión</h2>

            <!-- Formulario de Acceso por Correo -->
            <form id="formLogin">
                <div class="campo-grupo" style="margin-bottom: 15px;">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginCorreo" placeholder="tucorreo@gmail.com" required>
                </div>

                <div class="campo-grupo" style="margin-bottom: 8px;">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <!-- Enlace de recuperación de contraseña por código -->
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="#" id="linkRecuperar" style="font-size: 0.75rem; color: var(--color-titulo); text-decoration: none; font-weight: bold;">¿Olvidaste tu contraseña? (Recuperar con código)</a>
                </div>

                <button type="submit" class="btn-crear">Ingresar</button>
            </form>

            <div class="enlace-pie">
                ¿No tienes cuenta? <a href="../index.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <!-- Script de lógica para el login -->
    <script src="../03_js/03_login.js"></script>
</body>
</html>
